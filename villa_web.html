<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #e0f2f2; padding: 50px; }
        .login-box { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #006666; text-align: center; margin-bottom: 25px; font-size: 22px; }
        label { display: block; margin: 12px 0 5px; font-size: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { width: 100%; background: #008080; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #005959; }
        .error { margin-top: 15px; padding: 10px; background: #f8d7da; color: #721c24; border-radius: 5px; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #006666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Admin Login</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
